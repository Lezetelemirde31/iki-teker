<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Iki Tekerli — Bağlantı yoxdur</title>
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0c" media="(prefers-color-scheme: dark)" />
    <style>
      /* Self-contained: an offline page cannot rely on a stylesheet download. */
      :root {
        --canvas: #f4f1ea;
        --ink: #12110f;
        --muted: #6e6a61;
        --brand: #ffc800;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d0d0c;
          --ink: #f5f3ee;
          --muted: #a19c92;
          --brand: #ffd027;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: var(--brand);
        color: #12110f;
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 0 0 0.625rem;
        font-size: 1.375rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto;
        max-width: 20rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      button {
        margin-top: 1.75rem;
        padding: 0.875rem 1.5rem;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #12110f;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">IT</div>
      <h1>Bağlantı yoxdur</h1>
      <p>
        İnternet bağlantısı bərpa olunanda Iki Tekerli yenidən işləyəcək. Baxdığınız
        səhifələr yaddaşda saxlanılıb.
      </p>
      <button type="button" onclick="location.reload()">Yenidən cəhd et</button>
    </main>
  </body>
</html>
